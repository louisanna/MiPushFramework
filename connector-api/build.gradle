apply plugin: 'com.android.library'

android {
    namespace 'com.xiaomi.xmsf.connector.api'
    compileSdk 37

    defaultConfig {
        minSdk 21
        targetSdk 30
    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}