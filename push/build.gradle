apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.android.application'


android {
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileSdk 37

    defaultConfig {
        applicationId "com.xiaomi.xmsf"
        minSdk 21
        // Keep alive
        targetSdk 37
        // XMPush sdk requires XMPushService not exported, but sdk will start exported XMPushService after
        // XMSF version code 106. SDK will also check version code must >= 105.
        // @see com.xiaomi.mipush.sdk.PushServiceClient#register
        // @see com.xiaomi.mipush.sdk.PushServiceClient#createServiceIntent
        // @see com.xiaomi.mipush.sdk.PushServiceClient#getPushServiceName
        // Fork 版本号重新编号：versionName 0.1.0 / versionCode 10017。
        // 10000 < 上游 0.3.11 的 1003003000，属于降级；从旧版升级必须先彻底移除旧包
        // （pm uninstall），让系统在重启后把这个 APK 当成全新安装来解析。
        versionCode 10017
        versionName "0.1.17"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'armeabi', 'armeabi-v7a', 'x86', "arm64-v8a", "x86_64"
        }

        buildConfigField "String", "GIT_TAG", "\"" + rootProject.ext.gitTag + "\""
    }

    testOptions {
        unitTests.all {
            jvmArgs '-noverify'
        }
    }

    flavorDimensions = ["version"]
    productFlavors {
        normal {
            dimension "version"
        }
        vc105 {
            dimension "version"
            versionCode = 105
        }
        prebuilt {
            dimension "version"
        }
    }
    androidComponents {
        onVariants(selector().all()) { variant ->
            if(variant.name.startsWith("prebuilt")) {
                variant.androidResources.noCompress.add('dex')
            }
        }
    }

            namespace 'top.trumeet.mipush.provider'

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing = true
            enableV4Signing = true

            def locale = project.rootProject.file(".yuuta.jks")
            def keystorePwd = System.getenv("KEYSTORE_PASS")
            def alias = System.getenv("ALIAS_NAME")
            def pwd = System.getenv("ALIAS_PASS")
            if (project.rootProject.file('local.properties').exists()) {
                Properties properties = new Properties()
                properties.load(project.rootProject.file('local.properties').newDataInputStream())
                locale = properties.getProperty("KEY_LOCATE")
                keystorePwd = properties.getProperty("KEYSTORE_PASSWORD")
                alias = properties.getProperty("KEYSTORE_ALIAS")
                pwd = properties.getProperty("KEY_PASSWORD")
            }

            if (locale != null) {
                storeFile file(locale)
                storePassword keystorePwd
                keyAlias alias
                keyPassword pwd
            }
        }

        // Release 签名：优先读 local.properties / 环境变量，缺省用仓库根目录的 release.jks
        release {
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing = true

            def storePath = System.getenv("RELEASE_STORE_FILE") ?: "release.jks"
            def storePass = System.getenv("RELEASE_STORE_PASSWORD")
            def keyAliasName = System.getenv("RELEASE_KEY_ALIAS")
            def keyPass = System.getenv("RELEASE_KEY_PASSWORD")
            if (project.rootProject.file('local.properties').exists()) {
                Properties releaseProps = new Properties()
                releaseProps.load(project.rootProject.file('local.properties').newDataInputStream())
                storePath = releaseProps.getProperty("RELEASE_STORE_FILE", storePath)
                storePass = releaseProps.getProperty("RELEASE_STORE_PASSWORD", storePass)
                keyAliasName = releaseProps.getProperty("RELEASE_KEY_ALIAS", keyAliasName)
                keyPass = releaseProps.getProperty("RELEASE_KEY_PASSWORD", keyPass)
            }

            storeFile project.rootProject.file(storePath)
            storePassword storePass
            keyAlias keyAliasName
            keyPassword keyPass
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            //shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }


    buildFeatures {
        compose true
    }
        namespace 'com.xiaomi.xmsf'
}

dependencies {
// modules {
    implementation project(':common')
    implementation project(':condom')
    implementation files("../mipush_hook/libs/mipush_hook_aspects.jar")
    implementation project(':connector')
    implementation project(':config')
    implementation files("../mipush_hook/libs/miuipushsdkshared_woven.jar")
// }

// feature dependencies {
    // Log
    implementation('com.elvishew:xlog:1.11.0', {
        exclude group: 'com.android.support'
    })

    implementation 'com.github.heruoxin:IceBox-SDK:55dd857d74'
    implementation 'com.google.code.gson:gson:2.10'

    // The core module that provides APIs to a shell
    implementation "com.github.topjohnwu.libsu:core:5.0.5"

    // https://mvnrepository.com/artifact/com.github.promeg/tinypinyin
    implementation 'com.github.promeg:tinypinyin:2.0.3'

    // GreenDao
    implementation 'org.greenrobot:greendao:3.3.0'
// }

// Test {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation("org.mockito:mockito-android:4.11.0")
    testImplementation("org.mockito:mockito-core:4.11.0")
    testImplementation("org.mockito:mockito-inline:4.11.0")
// }

// Base {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.palette:palette:1.0.0'


    implementation "androidx.compose.ui:ui:1.4.0"
    implementation "androidx.compose.material3:material3:1.0.0"
    implementation "androidx.compose.ui:ui-tooling-preview:1.4.0"
    implementation "androidx.compose.ui:ui-tooling:1.4.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    implementation "androidx.activity:activity-compose:1.7.0"
    implementation 'androidx.navigation:navigation-compose:2.6.0'
    implementation "org.jetbrains:markdown:0.7.3"
    implementation "com.google.accompanist:accompanist-swiperefresh:0.30.1"

    // Support
    implementation 'androidx.appcompat:appcompat:1.5.0'
// }


}
androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        variantBuilder.enableUnitTest = true
    }
}

dependencies {
    implementation "androidx.compose.foundation:foundation:1.4.0"
    implementation "org.aspectj:aspectjrt:1.9.22"
}
